          --sitebg: rgb(33, 33, 36);
          --headerbg: rgb(62, 64, 70);
          --headertext: rgb(217, 220, 228);
          --columnborder: #808a9f;
          --tipsbg: rgb(54, 51, 71);
          --tipstext: rgb(217, 220, 228);
          --inputtext: rgb(213, 211, 225);
          --inputbg: rgb(33, 33, 36);
          --button: #bdb4b918;
          --tipslink: #9583ff;
          --scrollbg: rgb(87, 87, 87);
          --scrollbgo: #363636;
        }
      }

      @media (prefers-color-scheme: light) {
        :root {
          --sitebg: rgb(255, 215, 222);
          --headerbg: #ffaab5;
          --headertext: rgb(59, 35, 10);
          --columnborder: #f72081;
          --tipsbg: rgb(254, 208, 208);
          --inputtext: rgb(28, 27, 34);
          --inputbg: rgb(252, 249, 253);
          --button: #ff788a36;
          --tipslink: #f72081;
          --scrollbg: #ffbfbf;
          --scrollbgo: #fecdcd87;
        }
      }

      :root[data-theme="light"] {
        --sitebg: rgb(255, 215, 222);
        --headerbg: #ffaab5;
        --headertext: rgb(59, 35, 10);
        --columnborder: #f72081;
        --tipsbg: rgb(254, 208, 208);
        --inputtext: rgb(28, 27, 34);
        --inputbg: rgb(252, 249, 253);
        --button: #ff788a36;
        --tipslink: #f72081;
        --scrollbg: #ffbfbf;
        --scrollbgo: #fecdcd87;
      }

      :root[data-theme="dark"] {
        --sitebg: rgb(33, 33, 36);
        --headerbg: rgb(62, 64, 70);
        --headertext: rgb(217, 220, 228);
        --columnborder: #808a9f;
        --tipsbg: rgb(54, 51, 71);
        --tipstext: rgb(217, 220, 228);
        --inputtext: rgb(213, 211, 225);
        --inputbg: rgb(33, 33, 36);
        --button: #bdb4b918;
        --tipslink: #9583ff;
        --scrollbg: rgb(87, 87, 87);
        --scrollbgo: #363636;
      }

      body {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        margin: 0px;
        padding: 0px;
        display: flex;
        flex-direction: column;
        background-color: var(--sitebg);
      }

      header {
        width: 100%;
        height: 52px;
        min-height: 52px;
        background-color: var(--headerbg);
        color: var(--headertext);
        display: flex;
        font-size: 18px;
        padding: 14px;
        overflow: hidden;
        white-space: nowrap;
      }

      header #download {
        color: var(--headertext);
        margin-right: 20px;
        text-decoration: none;
        align-items: center;
      }

      .svg-icon {
        fill: var(--headertext);
      }

      header .btn-dark {
        cursor: pointer;
        height: 26px;
        text-decoration: none;
        background-color: rgba(0, 0, 0, 0);
        border-style: solid;
        border-color: var(--button);
        color: var(--headertext);
        margin-right: 10px;
        align-items: center;
      }

      header .btn-copy,
      header .btn-ecl {
        cursor: pointer;
        height: 26px;
        text-decoration: none;
        background-color: rgba(0, 0, 0, 0);
        border-style: solid;
        border-color: var(--button);
        color: var(--headertext);
        margin-right: 10px;
        align-items: center;
      }

      header #download {
        border: none;
        color: none;
        background: none;
        margin-top: -1px;
      }

      .expand {
        flex: 1;
      }

      #text-and-qr {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
      }

      .CourierNew {
        font-family: "Courier New", -apple-system, STXihei, system-ui;
        word-break: break-all;
        font-size: 15px;
      }

      .linktip {
        word-break: break-all;
      }

      #input-div {
        min-height: 100px;
        min-width: 200px;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: none;
        border-radius: 6px;
      }

      #input {
        width: 100%;
        height: 100%;
        flex: 1;
        resize: none;
        background-color: var(--inputbg);
        color: var(--inputtext);
        border-radius: 6px;
        padding: 5px;
      }

      #input-error {
        margin-bottom: 10px;
        display: none;
      }

      #input:focus {
        border-color: var(--columnborder);
        border-width: 2px;
        outline: 0;
        flex: 1;
        -webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075),
          0 0 8px rgba(84, 10, 44, 0.6);
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075),
          0 0 8px rgba(84, 10, 44, 0.6);
      }

      .error {
        width: 100%;
        background-color: var(--tipsbg);
        border: 2px solid var(--columnborder);
        border-radius: 10px;
        padding: 5px;
        color: var(--tipstext);
      }

      .linktip {
        color: var(--tipslink);
        text-decoration: none;
      }

      #qrcode {
        width: 100%;
        height: 100%;
      }

      #qrcode canvas {
        margin: auto;
        display: block;
      }

      .scroll-div {
        height: 200px;
        overflow-x: hidden;
        overflow-y: auto;
        float: left;
        border: none;
      }
      .scroll::-webkit-scrollbar {
        nav-right: 2px;
        width: 10px;
        height: auto;
      }
      .scroll::-webkit-scrollbar-thumb {
        border-radius: 10px;
        background: var(--scrollbg);
      }
      .scroll::-webkit-scrollbar-track {
        border-radius: 20px;
        background: var(--scrollbgo);
      }
      .error-text {
        font-size: 20px;
      }
    </style>

          window.document.documentElement.setAttribute("data-theme", "dark");

          window.document.documentElement.setAttribute("data-theme", "light");

      if (location.hash.length > 1) {
        let initial_value = location.hash.slice(1); // remove leading '#'
        initial_value = decodeURIComponent(initial_value); // URL encoded because of special characters
        console.log("Using initial value from URL hash:", initial_value);
        input_area.value = initial_value;
      }

      const PADDING = 10; // 5px on any side for the text-and-qr element -> always 10px in total

        // message is untrusted input, so we should escape it properly

          input_error.innerHTML = ""; // remove current children

          input_error.style.display = "block";
          setTimeout(() => {
            input_error.style.display = "none";

        } else {
          input_error.style.display = "none";

      max_length = MAX_TEXT_LENGTH_FOR[ERROR_CORRECTION_LEVEL];

        const max_size_fit_window = Math.min(
          isbrowsersafari * qrcode.clientWidth,
          isbrowsersafari * qrcode.clientHeight,
          QR_MAX_SIZE

        max_length = MAX_TEXT_LENGTH_FOR[ERROR_CORRECTION_LEVEL];
        if (!text) {
          showQrCodeGenerationError(infoweb);
        } else if (text.length > max_length) {
          showQrCodeGenerationError(
            `${toomanybit} (${text.length}/${max_length})`
          );
        } else {

          try {
            darkMode =
              window.document.documentElement.getAttribute("data-theme") ||
              "light";
            if (darkMode == "dark") {
              colorQR_BG = "#9ea8bd";
              colorQR_Fill = "#1e0132";
            } else {
              colorQR_BG = "#fff5fb";
              colorQR_Fill = "#32011e";

              {
                text: text,
                radius: 0.0, // square pixels
                ecLevel: ERROR_CORRECTION_LEVEL,
                fill: colorQR_Fill,
                background: colorQR_BG,
                size: qr_size - 2 * QR_BORDER_SIZE,

              qrcode

                0,
                0,
                qr_size,
                qr_size,
                QR_BORDER_SIZE,

                qr_size - 2 * QR_BORDER_SIZE,

        input_error.style.display = "none";
